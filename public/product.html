<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product</title>
<style>body{font-family:system-ui,sans-serif;max-width:600px;margin:auto;padding:16px}img{max-width:100%;border-radius:8px}</style></head><body>
<a href="/">← Back to shop</a><h2 id="n"></h2><img id="i" alt=""><p id="p"></p><p id="d"></p>
<script>fetch('/api/products').then(r=>r.json()).then(ps=>{const x=ps.find(p=>p.id==new URLSearchParams(location.search).get('id'));if(!x){n.textContent='Product not found';return}document.title=x.name;n.textContent=x.name;i.src=x.image_url||'';p.textContent='₦'+x.retail_price.toLocaleString();d.textContent=x.description})</script></body></html>
